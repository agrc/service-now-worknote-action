name: 'Service Now work note deployment notification'
description: 'Creates a new work note for a specific item in a table whenever a deployment is reviewed and published.'
inputs:
  repo-token:
    description: 'the github token for the runner'
    required: true
  client-id:
    description: 'the client id of the credentials for OAuth authentication'
    required: true
  client-secret:
    description: 'the client secret of the credentials for OAuth authentication'
    required: true
  instance-name:
    description: 'the ServiceNow host (e.g. `workspaces.dts.utah.gov`, `dev.workspaces.dts.utah.gov`)'
    required: false
    default: 'workspaces.dts.utah.gov'
  table-name:
    description: 'the table name that contains the system id item to update'
    required: true
  system-id:
    description: 'the specific sys-id (row) item to write a work note for'
    required: true
runs:
  using: 'node24'
  main: 'dist/index.js'
